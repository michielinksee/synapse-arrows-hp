    main.aib { padding-top: 72px; }
    :root { --g1:#f58529; --g2:#dd2a7b; --g3:#8134af; --grad:linear-gradient(45deg,var(--g1),var(--g2) 55%,var(--g3)); --ink:#111827; --sub:#6b7280; --line:#e5e7eb; --bg:#fafafa; --bad:#dc2626; }

<body>
<header><nav class="nav"><div class="container nav-inner"><a href="/" class="nav-logo"><img src="/logo.png" alt="Synapse Arrows" width="32" height="32">Synapse Arrows</a><ul class="nav-links"><li><a href="/ai-bae-shindan/" class="nav-cta nav-cta-ai active">AI映え診断</a></li><li><a href="/services/">サービスと料金</a></li><li><a href="/insights/">調査・記事</a></li><li><a href="/about/">会社</a></li><li><a href="/tools/">無料ツール</a></li><li><a href="/contact/" class="nav-cta">資料請求・相談</a></li></ul><button class="mobile-menu-btn" aria-label="Menu"><span></span><span></span><span></span></button></div></nav></header>
<main class="aib">
<div class="wrap">
  <div class="top"><a href="/ai-bae-shindan/">← AI映え診断</a></div>
  <div class="card" id="box">
    <h1>お申し込みの確定</h1>
    <p id="ask">下のボタンを押すと、詳しい診断のお申し込みが確定します。</p>
    <button id="go">申し込みを確定する</button>
    <div class="msg" id="msg"></div>
  </div>

</main>
<footer class="footer"><div class="container footer-inner"><div class="footer-logo">Synapse Arrows Pte. Ltd</div><ul class="footer-links"><li><a href="https://kansei-link.com" target="_blank" rel="noopener">KanseiLINK</a></li><li><a href="/services/">Services</a></li><li><a href="/tools/">Tools</a></li><li><a href="/policy/">Privacy</a></li><li><a href="/terms/">Terms</a></li></ul><div class="footer-copy">&copy; 2026 Synapse Arrows Pte. Ltd. All rights reserved.</div></div></footer>
<script>
// The link from the email opens this page; nothing is written until the button is pressed (POST).
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3000' : 'https://mcp.kansei-link.com';
const token = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const show = (html) => { $('msg').innerHTML = html; $('msg').classList.add('show'); };
if (!/^[A-Za-z0-9_-]{40,60}$/.test(token)) { $('go').style.display = 'none'; $('ask').style.display = 'none'; show('<p class="bad">リンクが正しくありません。メールのリンクをもう一度開いてください。</p>'); }
$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  try {
    const r = await fetch(API_BASE + '/api/ai-bae/confirm', { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    const j = await r.json().catch(() => ({}));
    history.replaceState(null, '', location.pathname); // drop the token from the address bar
    $('go').style.display = 'none'; $('ask').style.display = 'none';
    if (j.status === 'queued') {
      show(`<p>受付が完了しました。</p><p>いまの順番は <span class="big">${Number(j.position)}</span> 番目です。</p><p class="fine">詳しい診断は 1 日 ${Number(j.daily_limit)} 件ずつ順番に行います（目安: ${Number(j.estimated_days)} 日以内）。結果はメールでお送りします。</p>`);
    } else if (j.status === 'reused') {
      show('<p>受付が完了しました。</p><p class="fine">同じお店（ホームページ）の詳しい診断が、30 日以内に受け付け済みです。その結果を、このメールアドレスにもお送りします。</p>');
    } else if (j.error === 'email_limit') {
      show(`<p class="bad">このメールアドレスでは、30 日以内に別のお店の詳しい診断をお申し込みいただいています。</p><p class="fine">1 つのメールアドレスにつき 30 日に 1 店までです。${j.next_after ? String(j.next_after).replace(/[^0-9-]/g, '') + ' 以降に' : 'しばらくしてから'}、あらためてお申し込みください。</p>`);
    } else if (j.error === 'rate_limited') {
      $('go').style.display = ''; $('go').disabled = false; show('<p class="bad">少し時間をおいてから、もう一度押してください。</p>');
    } else {
      show('<p class="bad">このリンクは使えません（期限切れ、または確定済みです）。</p><p class="fine">お手数ですが、<a href="/ai-bae-shindan/apply/">お申し込みのページ</a>からもう一度お申し込みください。</p>');
    }
  } catch { $('go').disabled = false; show('<p class="bad">サーバーに接続できませんでした。時間をおいて、もう一度押してください。</p>'); }
});
</script>
